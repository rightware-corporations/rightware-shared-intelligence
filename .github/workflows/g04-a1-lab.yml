name: G04-A1 isolated credential laboratory
on:
  push:
    branches: [develop]
    paths:
      - 'backend/rightware_si/g04_a1_lab.py'
      - 'tests/g04_a1_lab/**'
      - 'backend/requirements/g04_a1_lab.txt'
      - '.github/workflows/g04-a1-lab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-signed-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RW_SI_ENVIRONMENT: lab
      RW_SI_ENABLE_G04_A1_LAB: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lab-only dependencies
        run: |
          python -m pip install -e . -r backend/requirements/g04_a1_lab.txt
          python -m pip check
          python -c "import jwt, cryptography; print('G04_A1_VERSIONS', jwt.__version__, cryptography.__version__)"
      - name: Execute isolated signed synthetic credential tests
        run: python -m unittest discover -s tests/g04_a1_lab -p 'test_*.py' -v

name: work02-postgres-core
on:
  push:
    branches: [feat/work02a-postgres-transactional-core]
  pull_request:
    branches: [docs/work01-domain-architecture]
permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rw
          POSTGRES_PASSWORD: rw-ci-only
          POSTGRES_DB: rw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rw -d rw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      RW_TEST_DATABASE_URL: postgresql://rw:rw-ci-only@127.0.0.1:5432/rw_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL driver (testing only)
        run: python -m pip install -r requirements-work02.txt
      - name: Syntax check
        run: python -m compileall -q rightware_si tests
      - name: Migrate disposable integration database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          sql = Path("db/migrations/0001_work02_core.sql").read_text(encoding="utf-8")
          with psycopg.connect(os.environ["RW_TEST_DATABASE_URL"], autocommit=True) as conn:
              conn.execute(sql)
          print("WORK-02A schema applied to disposable rw_test")
          PY
      - name: Deterministic and real PostgreSQL tests
        run: python -m unittest discover -s tests -v

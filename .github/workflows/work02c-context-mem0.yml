name: work02c-scoped-context
on:
  push:
    branches: [feat/work02c-scoped-context-mem0]
  pull_request:
    branches: [feat/work02b-auth-rest-mcp]
permissions:
  contents: read
jobs:
  core-context-contracts:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rw
          POSTGRES_PASSWORD: rw-ci-only
          POSTGRES_DB: rw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rw -d rw_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 15
    env:
      RW_TEST_DATABASE_URL: postgresql://rw:rw-ci-only@127.0.0.1:5432/rw_test
      RW_SI_DATABASE_URL: postgresql://rw:rw-ci-only@127.0.0.1:5432/rw_test
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install non-LLM test dependencies
        run: python -m pip install -r requirements-work02.txt -r requirements-work02b.txt
      - name: Syntax and imports
        run: |
          python -m compileall -q rightware_si tests scripts
          python -c "from rightware_si import context_service, mem0_local_service, client_readonly; print('work02c imports OK')"
      - name: Migrate isolated PostgreSQL database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ["RW_TEST_DATABASE_URL"],autocommit=True) as conn:
              for path in ("db/migrations/0001_work02_core.sql",
                           "db/migrations/0002_work02b_api_credentials.sql"):
                  conn.execute(Path(path).read_text(encoding="utf-8"))
                  print("MIGRATION_PASS",path)
          PY
      - name: Run all tests (real Postgres; FAKE Mem0; MCP SDK in-memory)
        run: python -m unittest discover -s tests -v

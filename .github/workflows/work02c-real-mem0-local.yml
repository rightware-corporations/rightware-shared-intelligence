name: work02c-REAL-mem0-ollama-smoke
on:
  push:
    branches: [feat/work02c-scoped-context-mem0]
permissions:
  contents: read
jobs:
  real-mem0-local:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mem0_pgvector:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: rw
          POSTGRES_PASSWORD: rw-ci-synthetic
          POSTGRES_DB: mem0_lab
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rw -d mem0_lab"
          --health-interval 5s
          --health-timeout 4s
          --health-retries 25
    env:
      MEM0_TELEMETRY: "false"
      RW_SI_MEM0_URL: http://127.0.0.1:8891
      RW_SI_MEM0_PG_DSN: postgresql://rw:rw-ci-synthetic@127.0.0.1:5433/mem0_lab
      RW_SI_MEM0_HISTORY: /tmp/work02c_mem0_history.sqlite
      RW_SI_OLLAMA_URL: http://127.0.0.1:11434
      RW_SI_OLLAMA_EMBED_MODEL: all-minilm:latest
      RW_SI_OLLAMA_EMBED_DIMS: "384"
      RW_SI_OLLAMA_LLM_MODEL: qwen3.5:2b
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate ephemeral local-only secret (not committed or printed)
        run: |
          python - <<'PY'
          import os, secrets
          token = secrets.token_urlsafe(48)
          print("::add-mask::" + token, flush=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("RW_SI_MEM0_API_KEY=" + token + "\n")
          PY
      - name: Verify pinned Mem0 and install real library
        run: |
          test "$(git -C vendor/mem0 rev-parse HEAD)" = "f1791daa86d469249c9b002f62644d58a1eb96a0"
          python -m pip install -r requirements-work02.txt -r requirements-work02b.txt -r requirements-work02c.txt
          python -m pip install -e vendor/mem0
          python -m pip install -e .
          python - <<'PY'
          from mem0 import Memory
          print("ACTUAL_MEM0_LIBRARY_IMPORT_PASS",Memory.__module__)
          PY
      - name: Start ephemeral Ollama local runtime
        run: |
          docker run -d --rm --name work02c-ollama --network host ollama/ollama:0.40.15
          for i in $(seq 1 90); do
            if curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null; then
              echo "OLLAMA_READY"
              break
            fi
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:11434/api/tags >/dev/null
      - name: Pull only the approved free local embedding model
        run: |
          docker exec work02c-ollama ollama pull all-minilm:latest
          docker exec work02c-ollama ollama list
      - name: Start REAL Mem0 OSS local FastAPI shim
        run: |
          python -m rightware_si.mem0_local_service > /tmp/work02c_mem0_service.log 2>&1 &
          echo $! > /tmp/work02c_mem0_service.pid
          for i in $(seq 1 50); do
            CODE=$(curl --silent -o /dev/null -w '%{http_code}' \
              -X POST http://127.0.0.1:8891/search \
              -H 'Content-Type: application/json' \
              -d '{"query":"test","filters":{"user_id":"rw:rwlab:alpha"}}' || true)
            if [ "$CODE" = "401" ]; then echo "MEM0_SHIM_AUTH_READY"; break; fi
            sleep 1
          done
          test "$CODE" = "401"
      - name: REAL Mem0 write/search/project isolation smoke with synthetic data
        run: python scripts/work02c_real_mem0_smoke.py
      - name: Report local engine logs on failure (no secrets)
        if: failure()
        run: |
          echo "MEM0_LOCAL_SERVICE_OUTPUT"
          tail -n 150 /tmp/work02c_mem0_service.log || true
          docker logs --tail 50 work02c-ollama || true
